services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pan
      POSTGRES_PASSWORD: pan
      POSTGRES_DB: pan
    ports:
      - "5433:5432"
    volumes:
      - pan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pan -d pan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pan_pg:
